<!DOCTYPE html>
<html lang="es">
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4a69bd">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Práctica de Voces – Worship</title>

<style>
body {
  font-family: system-ui, sans-serif;
  background: #f5f6fa;
  padding: 20px;
}

.card {
  max-width: 420px;
  background: white;
  margin: auto;
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 10px 25px rgba(0,0,0,.08);
  position: relative;
}

h2 {
  text-align: center;
  margin-top: 0;
}

label {
  font-weight: bold;
  margin-top: 15px;
  display: block;
}

select, button, input[type=range] {
  width: 100%;
  margin-top: 8px;
}

button {
  padding: 14px;
  font-size: 16px;
  border-radius: 12px;
  border: none;
  background: #4a69bd;
  color: white;
  margin-top: 10px;
}

button.secondary {
  background: #dcdde1;
  color: #333;
}

button:disabled,
input:disabled,
select:disabled {
  opacity: 0.5;
}

.controls {
  display: flex;
  gap: 10px;
}

.controls button {
  flex: 1;
}

/* Overlay de carga */
.loading {
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0.9);
  display: none;
  align-items: center;
  justify-content: center;
  border-radius: 16px;
  font-weight: bold;
  font-size: 18px;
}
</style>
</head>

<body>

<div class="card">
  <div id="loading" class="loading">⏳ Cargando audios…</div>

  <h2>🎶 Práctica de Voces</h2>

  <label>Canción</label>
  <select id="songSelect">
    <option value="al-que-esta">Al que está sentado en el trono</option>
    <option value="amamos-tanto">Amamos tanto tu Presencia</option>
    <option value="asi-peleo">Así peleo mis batallas</option>
    <option value="bautizados">Bautizados en fuego</option>
    <option value="bendito-jesus">Bendito Jesús</option>
    <option value="creo-en-ti">Creo en tí</option>
    <option value="derrama">Derrama de tu fuego</option>
    <option value="digno-la-cancion">Digno - La canción del Cordero</option>
    <option value="digo-si">Digo sí</option>
    <option value="dios-de-lo-imp">Dios de lo imposible</option>
    <option value="dios-incomparable">Dios incomparable</option>
    <option value="cielo-y-tierra">El cielo y la tierra</option>
    <option value="el-poderoso">El Poderoso de Israel</option>
    <option value="en-honor">En honor a tí</option>
    <option value="entrelazados">Entrelazados</option>
    <option value="eres-todopoderoso">Eres Todopoderoso</option>
    <option value="espacio-te">Espacio te haré</option>
    <option value="espiritu-santo">Espíritu Santo</option>
    <option value="eternamente">Eternamente amor</option>
    <option value="fiesta-en">Fiesta en el desierto</option>
    <option value="fuego">Fuego</option>
    <option value="generacion-que">Generación que danza</option>
    <option value="hay-libertad">Hay libertad</option>
    <option value="hosanna">Hosanna</option>
    <option value="increible">Increíble</option>
    <option value="la-tierra-canta">La tierra canta</option>
    <option value="libre-soy">Libre soy</option>
    <option value="lo-haras-otra">Lo harás otra vez</option>
    <option value="manda-lluvia">Manda lluvia</option>
    <option value="mi-plenitud">Mi plenitud</option>
    <option value="milagros">Milagros</option>
    <option value="nada-es-imp">Nada es imposible</option>
    <option value="no-hay-lugar">No hay lugar más alto</option>
    <option value="nuestro-Dios">Nuestro Dios</option>
    <option value="padre-nuestro">Padre Nuestro</option>
    <option value="por-siempre">Por siempre</option>
    <option value="que-los-cielos">Que los cielos</option>
    <option value="rey">Rey</option>
    <option value="rey-de-gloria">Rey de gloria</option>
    <option value="rey-de-reyes">Rey de reyes</option>
    <option value="ruge">Ruge</option>
    <option value="santo-por-siempre">Santo por siempre</option>
    <option value="somos-libres">Somos libres</option>
    <option value="eres-fiel">Señor eres fiel</option>
    <option value="te-dare-lo">Te daré lo mejor</option>
    <option value="vamos-a-cantar">Vamos a cantar</option>
    <option value="vine-a-ador">Vine a adorarte</option>
    <option value="ya-no-soy-esclavo">Ya no soy esclavo</option> 
    <option value="yeshua-el-sonido">Yeshua, el sonido de libertad</option> 
    <option value="yo-danzo-en">Yo danzo en el río</option>  
  </select>

  <button id="playBtn" onclick="play()">▶ Play</button>
  <button id="pauseBtn" class="secondary" onclick="pause()">⏸ Pause</button>

  <div class="controls">
    <button class="secondary" onclick="seek(-10)">⏪ -10s</button>
    <button class="secondary" onclick="seek(10)">⏩ +10s</button>
  </div>

  <label>⏱ Progreso</label>
  <input id="progress" type="range" min="0" max="100" value="0">

  <div id="timeDisplay" style="text-align:center; margin-top:6px; font-weight:bold;">
  00:00 / 00:00
  </div>

  <label>🎼 Track</label>
  <input type="range" min="0" max="1" step="0.01" value="1"
         oninput="gainTrack.gain.value = this.value">

  <label>🎤 Voz 1</label>
  <input type="range" min="0" max="1" step="0.01" value="1"
         oninput="gainVoz1.gain.value = this.value">

  <label>🎤 Voz 2</label>
  <input type="range" min="0" max="1" step="0.01" value="1"
         oninput="gainVoz2.gain.value = this.value">
</div>

<script>
let audioCtx;
let buffers = {};
let sources = {};
let gainTrack, gainVoz1, gainVoz2;

let startTime = 0;
let pauseTime = 0;
let isPlaying = false;
let duration = 0;
let progressInterval;

const songSelect = document.getElementById('songSelect');
const progress = document.getElementById('progress');
const loading = document.getElementById('loading');
const controls = document.querySelectorAll('button, input, select');

document.body.addEventListener('touchend', async () => {
  if (audioCtx && audioCtx.state === 'suspended') {
    await audioCtx.resume();
  }
}, { once: true });


function formatTime(seconds) {
  const min = Math.floor(seconds / 60);
  const sec = Math.floor(seconds % 60);
  return `${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function setEnabled(enabled) {
  controls.forEach(el => el.disabled = !enabled);
}

async function initAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  gainTrack = audioCtx.createGain();
  gainVoz1 = audioCtx.createGain();
  gainVoz2 = audioCtx.createGain();

  gainTrack.connect(audioCtx.destination);
  gainVoz1.connect(audioCtx.destination);
  gainVoz2.connect(audioCtx.destination);

  await loadSong();
}

async function loadBuffer(url) {
  const res = await fetch(url);
  const arrayBuffer = await res.arrayBuffer();
  return await audioCtx.decodeAudioData(arrayBuffer);
}

async function loadSong() {
  setEnabled(false);
  loading.style.display = 'flex';

  const song = songSelect.value;
  const base = `canciones/${song}/`;

  buffers.track = await loadBuffer(base + 'track.mp3');
  buffers.voz1  = await loadBuffer(base + 'voz1.mp3');
  buffers.voz2  = await loadBuffer(base + 'voz2.mp3');

  duration = buffers.track.duration;

  document.getElementById('timeDisplay').innerText = `00:00 / ${formatTime(duration)}`;
  
  progress.max = duration;
  progress.value = 0;
  pauseTime = 0;

  loading.style.display = 'none';
  setEnabled(true);
  isPlaying = false;

}

function createSources(offset = 0) {
  sources.track = audioCtx.createBufferSource();
  sources.voz1  = audioCtx.createBufferSource();
  sources.voz2  = audioCtx.createBufferSource();

  sources.track.buffer = buffers.track;
  sources.voz1.buffer  = buffers.voz1;
  sources.voz2.buffer  = buffers.voz2;

  sources.track.connect(gainTrack);
  sources.voz1.connect(gainVoz1);
  sources.voz2.connect(gainVoz2);

  sources.track.start(0, offset);
  sources.voz1.start(0, offset);
  sources.voz2.start(0, offset);

  startTime = audioCtx.currentTime - offset;
}

async function play() {
  if (!audioCtx) {
    await initAudio();
  }

  // 🔑 CLAVE PARA SAFARI
  if (audioCtx.state === 'suspended') {
    await audioCtx.resume();
  }

  if (isPlaying) return;

  createSources(pauseTime);
  isPlaying = true;

  progressInterval = setInterval(() => {
  const current = audioCtx.currentTime - startTime;
  const safeCurrent = Math.min(current, duration);

  progress.value = safeCurrent;
  document.getElementById('timeDisplay').innerText =
    `${formatTime(safeCurrent)} / ${formatTime(duration)}`;
  }, 200);
}


function pause() {
  if (!isPlaying) return;

  pauseTime = audioCtx.currentTime - startTime;

  sources.track.stop();
  sources.voz1.stop();
  sources.voz2.stop();

  clearInterval(progressInterval);
  isPlaying = false;
}

function seek(seconds) {
  pause();
  pauseTime = Math.max(0, Math.min(duration, pauseTime + seconds));
  play();
}

progress.addEventListener('input', () => {
  pauseTime = Number(progress.value);

  document.getElementById('timeDisplay').innerText =
    `${formatTime(pauseTime)} / ${formatTime(duration)}`;

  if (isPlaying) {
    pause();
    pauseTime = Number(progress.value);
    play();
  }
});

songSelect.addEventListener('change', async () => {
  if (!audioCtx) return;
  pause();
  await loadSong();
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./service-worker.js')
    .then(() => console.log('Service Worker registrado'))
    .catch(err => console.error('SW error', err));
}

</script>

</body>
</html>
